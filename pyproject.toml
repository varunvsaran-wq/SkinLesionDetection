[project]
name = "dermassist"
version = "0.1.0"
description = "Agentic skin-lesion analysis pipeline (LangGraph). Research/educational only — NOT a medical device."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Phase 0/1 core dependencies only: enough to run the mocked graph end-to-end
# with a resumable human-review gate. Heavier ML/UI deps live in optional groups
# below so the skeleton stays fast to install (per HANDOFF.md build order).
dependencies = [
    "langgraph>=0.2.50",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Phase 4 — Claude interpretation + structured output
reasoning = [
    "anthropic>=0.40",
]
# Phase 2 — image preprocessing (lightweight: no torch)
preprocess = [
    "numpy>=1.26",
    "pillow>=10.0",
    "opencv-python>=4.9",
]
# Phase 3 — vision classifier (heavy: pulls in torch). Includes preprocess.
vision = [
    "dermassist[preprocess]",
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.44",
]
# Phase 5 — literature retrieval (PubMed MCP + local PubMedBERT + local ChromaDB)
literature = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "mcp>=1.2",
]
# Phase 6 — review UI
ui = [
    "streamlit>=1.36",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
dermassist = "dermassist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dermassist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
